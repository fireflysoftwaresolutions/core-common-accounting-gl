components:
  schemas:
    JournalBatchDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
        status:
          type: string
          enum:
          - OPEN
          - POSTED
          - CANCELLED
          - REVERSED
        batchDate:
          type: string
          format: date
        remarks:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    JournalEntryDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
        transactionId:
          type: string
        sourceModule:
          type: string
        totalAmount:
          type: number
        description:
          type: string
        entryDate:
          type: string
          format: date-time
        posted:
          type: boolean
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    JournalLineDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entryId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        amount:
          type: number
        drCr:
          type: string
          enum:
          - DR
          - CR
        memo:
          type: string
        fxCurrency:
          type: string
        fxRate:
          type: number
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GlAccountDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - ASSET
          - LIABILITY
          - INCOME
          - EXPENSE
          - EQUITY
        parentId:
          type: string
          format: uuid
        active:
          type: boolean
        currency:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        leaf:
          type: boolean
    GlCurrencyReference:
      required:
      - currencyId
      - digest
      - encodingVersion
      - isoCode
      - policyId
      - version
      type: object
      properties:
        policyId:
          type: string
        currencyId:
          type: string
        isoCode:
          type: string
        version:
          type: integer
          format: int64
        digest:
          type: string
        encodingVersion:
          type: string
      additionalProperties: false
    GlPostingEntry:
      required:
      - description
      - entryKey
      - lines
      type: object
      properties:
        entryKey:
          type: string
        description:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/GlPostingLine"
      additionalProperties: false
    GlPostingLine:
      required:
      - accountId
      - amountMinor
      - currency
      - currencyAdmissionId
      - expectedAccountVersion
      - expectedCurrencyVersion
      - lineKey
      - memo
      - postedScale
      - side
      type: object
      properties:
        lineKey:
          type: string
        accountId:
          type: string
        expectedAccountVersion:
          type: integer
          format: int64
        currencyAdmissionId:
          type: string
        expectedCurrencyVersion:
          type: integer
          format: int64
        currency:
          $ref: "#/components/schemas/GlCurrencyReference"
        postedScale:
          type: integer
          format: int32
        side:
          type: string
        amountMinor:
          pattern: "[1-9][0-9]{0,37}"
          type: string
        memo:
          type: string
      additionalProperties: false
    GlPostingRequest:
      required:
      - actionId
      - businessDate
      - description
      - entries
      - expectedBookVersion
      - expectedPeriodVersion
      - mappingDigest
      - mappingId
      - mappingVersion
      - notAfterEpochMillis
      - periodId
      - source
      - sourceOccurrenceEpochMillis
      type: object
      properties:
        actionId:
          type: string
        periodId:
          type: string
        expectedBookVersion:
          type: integer
          format: int64
        expectedPeriodVersion:
          type: integer
          format: int64
        notAfterEpochMillis:
          type: integer
          format: int64
        businessDate:
          type: string
        sourceOccurrenceEpochMillis:
          type: integer
          format: int64
        source:
          $ref: "#/components/schemas/GlSourceReference"
        mappingId:
          type: string
        mappingVersion:
          type: integer
          format: int64
        mappingDigest:
          type: string
        description:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/GlPostingEntry"
      additionalProperties: false
    GlSourceReference:
      required:
      - digest
      - effectOrdinal
      - effectReference
      - eventKind
      - financialReceiptReference
      - objectReference
      - observedAtEpochMillis
      - owner
      - provenanceReference
      - revision
      type: object
      properties:
        owner:
          type: string
        objectReference:
          type: string
        effectReference:
          type: string
        revision:
          type: integer
          format: int64
        digest:
          type: string
        eventKind:
          type: string
        effectOrdinal:
          type: integer
          format: int32
        financialReceiptReference:
          type: string
        provenanceReference:
          type: string
        observedAtEpochMillis:
          type: integer
          format: int64
      additionalProperties: false
    GlPostingReceipt:
      required:
      - actionId
      - intentDigest
      - journalSequence
      - postingId
      - receiptId
      - recordedAt
      - recovered
      type: object
      properties:
        receiptId:
          type: string
          format: uuid
        actionId:
          type: string
          format: uuid
        postingId:
          type: string
          format: uuid
        journalSequence:
          type: integer
          format: int64
        intentDigest:
          type: string
        recovered:
          type: boolean
        recordedAt:
          $ref: "#/components/schemas/FireflyInstant"
      additionalProperties: false
    GlPostingErrorResponse:
      required:
      - code
      - status
      type: object
      properties:
        status:
          type: integer
          format: int32
        code:
          type: string
          enum:
          - GL_POSTING_REQUEST_FAILED
          - GL_POSTING_COMMIT_KNOWN_RECOVERY_REQUIRED
          - GL_POSTING_OUTCOME_UNCERTAIN_RECOVERY_REQUIRED
        actionReference:
          type: string
          description: Original action reference when explicitly supplied by the owner;
            never a new action
          format: uuid
          nullable: true
      additionalProperties: false
    GlFinancialApprovalTransitionRequest:
      required:
      - commandId
      - expectedRevision
      type: object
      properties:
        commandId:
          type: string
          format: uuid
        expectedRevision:
          type: integer
          format: int64
      additionalProperties: false
    GlFinancialApprovalReceipt:
      required:
      - approvalId
      - lastCommandId
      - revision
      - state
      type: object
      properties:
        approvalId:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - REQUESTED
          - APPROVED
          - REVOKED
        revision:
          type: integer
          format: int64
        approvedUntilEpochMillis:
          type: integer
          format: int64
        lastCommandId:
          type: string
          format: uuid
      additionalProperties: false
    GlFinancialApprovalCheckRequest:
      required:
      - commandId
      - expectedIntentDigest
      - expectedRevision
      - expectedSnapshotId
      - expectedSnapshotSha256
      type: object
      properties:
        commandId:
          type: string
          format: uuid
        expectedRevision:
          type: integer
          format: int64
        expectedSnapshotId:
          type: string
          format: uuid
        expectedSnapshotSha256:
          type: string
        expectedIntentDigest:
          type: string
      additionalProperties: false
    AccountBinding:
      type: object
      properties:
        ledger:
          $ref: "#/components/schemas/LedgerAccountReference"
        leaf:
          $ref: "#/components/schemas/PostingLeaf"
    ControlReference:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
    CurrencyCrosswalk:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        digest:
          type: string
        ledgerPolicy:
          type: string
        scale:
          type: integer
          format: int32
        masters:
          $ref: "#/components/schemas/GlCurrencyReference"
        admissionId:
          type: string
          format: uuid
        admissionVersion:
          type: integer
          format: int64
    GlFinancialApprovalRequest:
      required:
      - businessUntilEpochMillis
      - commandId
      - mappingSnapshot
      - originalPosting
      type: object
      properties:
        commandId:
          type: string
          format: uuid
        businessUntilEpochMillis:
          type: integer
          format: int64
        originalPosting:
          $ref: "#/components/schemas/GlPostingRequest"
        mappingSnapshot:
          $ref: "#/components/schemas/MappingSnapshot"
      additionalProperties: false
    LedgerAccountReference:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        enrollmentId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
    MappingReference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        digest:
          type: string
        purpose:
          type: string
          enum:
          - INTERNAL_CUSTOMER_TRANSFER
    MappingSnapshot:
      type: object
      properties:
        tenant:
          type: string
        bookId:
          type: string
          format: uuid
        reference:
          $ref: "#/components/schemas/MappingReference"
        source:
          $ref: "#/components/schemas/AccountBinding"
        destination:
          $ref: "#/components/schemas/AccountBinding"
        currency:
          $ref: "#/components/schemas/CurrencyCrosswalk"
    PostingLeaf:
      type: object
      properties:
        tenant:
          type: string
        bookId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        role:
          type: string
        sourceType:
          type: string
        controlAncestors:
          type: array
          items:
            $ref: "#/components/schemas/ControlReference"
    GlFinancialApprovalDetail:
      required:
      - approval
      - businessUntilEpochMillis
      - intentDigest
      - mappingSnapshot
      - originalPosting
      - originalPostingJson
      - snapshotFormat
      - snapshotId
      - snapshotSha256
      type: object
      properties:
        approval:
          $ref: "#/components/schemas/GlFinancialApprovalReceipt"
        businessUntilEpochMillis:
          type: integer
          format: int64
        originalPosting:
          $ref: "#/components/schemas/GlPostingRequest"
        originalPostingJson:
          type: string
        intentDigest:
          type: string
        snapshotId:
          type: string
          format: uuid
        snapshotFormat:
          type: string
        mappingSnapshot:
          $ref: "#/components/schemas/MappingSnapshot"
        snapshotSha256:
          type: string
      additionalProperties: false
