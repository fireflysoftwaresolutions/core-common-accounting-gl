  /api/v1/tenants/{tenantId}/books/{bookId}/postings/recovery:
    post:
      tags:
      - NativeJournalPostings
      summary: Read the retained posting using the complete original request
      description: "Authorized recovery performs no new posting. A 404 is an observation\
        \ at this read, not an audited no-effect closure or permission to allocate\
        \ a new action."
      operationId: recoverNativeJournal
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      - name: bookId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlPostingRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlPostingReceipt"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlPostingErrorResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlPostingErrorResponse"
        "401":
          description: Current bearer authentication required
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GlPostingReceipt"
        "403":
          description: Current scoped policy and owner approval required
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GlPostingReceipt"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlPostingErrorResponse"
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlPostingErrorResponse"
        "503":
          description: "Unavailable or uncertain: retain the original action and use\
            \ protected recovery; never infer no effects"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlPostingErrorResponse"
        default:
          description: Other failures retain their HTTP status; no failure implies
            no effects or authorizes a new action
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GlPostingReceipt"
      security:
      - glBearer: []
      x-disable-idempotency: true
  /api/v1/tenants/{tenantId}/books/{bookId}/postings:
